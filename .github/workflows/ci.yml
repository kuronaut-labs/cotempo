name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm approve-scripts workerd esbuild || true
      - run: npm rebuild workerd esbuild
      - run: npm run cf-typegen
      - run: node scripts/check-contract-tests.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:contract
      - run: npx vite build

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm rebuild workerd esbuild
      # APP_URL is baked into wrangler.jsonc as http://localhost:3000 for dev.
      # A prod deploy that runs `wrangler deploy` with that default would put
      # invite/reset links to localhost and weaken BetterAuth's origin check
      # (the trustedOrigins helper trusts the configured APP_URL). Refuse
      # loopback and require the prod URL/MAIL_FROM as repository secrets. (#M4)
      - name: Validate prod APP_URL
        env:
          PROD_APP_URL: ${{ secrets.PROD_APP_URL }}
          PROD_MAIL_FROM: ${{ secrets.PROD_MAIL_FROM }}
        run: |
          if [ -z "$PROD_APP_URL" ] || [ -z "$PROD_MAIL_FROM" ]; then
            echo "::error::PROD_APP_URL and PROD_MAIL_FROM must be set as repository secrets before deploying."
            exit 1
          fi
          case "$PROD_APP_URL" in
            http://localhost*|http://127.0.0.1*|http://*)
              echo "::error::PROD_APP_URL must be an https:// URL (got '$PROD_APP_URL')."
              exit 1
              ;;
          esac
          echo "PROD_APP_URL=$PROD_APP_URL OK"
      - run: npx wrangler d1 migrations apply timesheeting --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy --var APP_URL:$PROD_APP_URL --var MAIL_FROM:$PROD_MAIL_FROM
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROD_APP_URL: ${{ secrets.PROD_APP_URL }}
          PROD_MAIL_FROM: ${{ secrets.PROD_MAIL_FROM }}
